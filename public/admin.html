<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveBite - Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .admin-container {
            padding: 100px 5% 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: var(--secondary-color);
        }

        .admin-header .btn {
            background: var(--white);
            color: var(--secondary-color);
            border: 1px solid #ddd;
        }

        .admin-header .btn:hover {
            background: #eee;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 5px solid var(--primary-color);
        }

        .stat-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            opacity: 0.8;
        }

        .stat-info h3 {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 5px;
            font-weight: 400;
        }

        .stat-info .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary-color);
        }

        /* Orders Table */
        .orders-container {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: var(--secondary-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tbody tr {
            transition: var(--transition);
        }

        tbody tr:hover {
            background-color: #fcfcfc;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-badge.completed {
            background-color: #d4edda;
            color: #155724;
        }

        .refresh-btn {
            background: var(--white);
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .refresh-btn:hover {
            background: #eee;
        }

        .refresh-btn i {
            margin-right: 5px;
            color: var(--primary-color);
        }

        /* Order Items List in Table */
        .order-items-list {
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .order-items-list li {
            margin-bottom: 3px;
        }

        #loading-msg {
            padding: 40px;
            text-align: center;
            color: var(--text-color);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar scrolled">
        <div class="logo">
            <i class="fa-solid fa-utensils"></i> Crave<span>Bite</span> <small
                style="font-size: 0.9rem; color: #777;">Admin</small>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">View Site</a></li>
        </ul>
    </nav>

    <!-- Admin Content -->
    <div class="admin-container">

        <div class="admin-header">
            <div>
                <h1>Dashboard Overview</h1>
                <p>Manage incoming orders in real-time.</p>
            </div>
            <button class="refresh-btn" onclick="fetchOrders()">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-clipboard-list stat-icon"></i>
                <div class="stat-info">
                    <h3>Total Orders</h3>
                    <div class="stat-value" id="total-orders">0</div>
                </div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-dollar-sign stat-icon" style="color: #2ecc71;"></i>
                <div class="stat-info">
                    <h3>Total Revenue</h3>
                    <div class="stat-value" id="total-revenue">₹0.00</div>
                </div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-clock stat-icon" style="color: #f1c40f;"></i>
                <div class="stat-info">
                    <h3>Pending Orders</h3>
                    <div class="stat-value" id="pending-orders">0</div>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="orders-container">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date & Time</th>
                            <th>Customer Info</th>
                            <th>Items ordered</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <!-- Orders inserted here -->
                    </tbody>
                </table>
            </div>
            <div id="loading-msg">Fetching latest orders...</div>
        </div>

    </div>

    <!-- Admin JS -->
    <script src="./js/admin.js"></script>
</body>

</html>
